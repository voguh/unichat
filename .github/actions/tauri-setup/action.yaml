name: setup tauri environment
description: Set up the Tauri environment

inputs:
  tauri-app-path:
    description: Working directory for the Tauri project
    required: true
  tauri-frontend-path:
    description: Path to the webapp frontend
    required: true
  rust-version:
    description: Rust version to install
    required: true
  node-version:
    description: Node.JS version to install
    required: true
  pnpm-version:
    description: PNPM version to install
    required: true

runs:
  using: composite
  steps:
    - name: Download webapp build artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: webapp-bundle
        path: ${{ inputs.tauri-frontend-path }}/dist

    - name: Rust toolchain setup
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: ${{ inputs.rust-version }}

    - name: Rust nightly toolchain setup
      if: ${{ runner.os == 'Linux' }}
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: nightly
        components: rustfmt,clippy

    - name: Cache cargo
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: ${{ inputs.tauri-app-path }}

    - name: Cache tauri bundler tools
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/tauri
          ~/AppData/Local/tauri
          ~/Library/Caches/tauri
        key: tauri-tools-${{ runner.os }}-2.12.2

    - name: Install PNPM
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Install Node.JS
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: ${{ inputs.tauri-frontend-path }}/pnpm-lock.yaml

    - name: Install linux dependencies
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends --no-install-suggests -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils

    - name: Prepare repository
      working-directory: ${{ inputs.tauri-app-path }}
      shell: bash
      run: |
        jq '.build.beforeBuildCommand = ""' tauri.conf.json > tmp.json && mv tmp.json tauri.conf.json
        npm install -g @tauri-apps/cli@2.12.2
        tauri --version

    - name: Install Webapp production dependencies
      working-directory: ${{ inputs.tauri-frontend-path }}
      shell: bash
      run: pnpm install --frozen-lockfile --prod

    - name: Clean stale artifacts
      working-directory: ${{ inputs.tauri-app-path }}
      shell: bash
      run: |
        rm -rf "./target/release/assets"
        rm -rf "./target/release/bundle"
        rm -rf "./target/release/examples"
        rm -rf "./target/release/icons"
        rm -rf "./target/release/plugins"
        rm -rf "./target/release/widgets"
        rm -rf "./target/release/LICENSE"
