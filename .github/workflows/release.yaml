name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

defaults:
  run:
    shell: bash

env:
  YQ_VERSION: v4.53.2
  ZBELL_REGISTRY: https://zbell.voguh.me

jobs:
  prepare-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check version consistency
        run: |
          export CARGO_PACKAGE_VERSION="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')"
          TAG_NAME="${{ github.ref_name }}"
          if [ "$CARGO_PACKAGE_VERSION" != "$TAG_NAME" ]; then
            echo "Error: The version in Cargo.toml ($CARGO_PACKAGE_VERSION) does not match the release tag ($TAG_NAME)."
            exit 1
          fi

  package:
    needs: [prepare-release]
    uses: ./.github/workflows/package.yaml

  publish:
    runs-on: ubuntu-24.04
    needs: [package]
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download windows build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-bundles
          path: target/windows

      - name: Download linux build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-bundles
          path: target/linux

      - name: Download macos build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-bundles
          path: target/macos

      - name: Pack unichat-api
        run: ./zztools/build-npm-package.py

      - name: Move build artifacts
        run: |
          export VERSION="${{ github.ref_name }}"
          mkdir -p dist
          cp target/linux/appimage/*.AppImage dist/unichat-$VERSION.AppImage
          cp target/linux/deb/*.deb dist/unichat-$VERSION.deb
          cp target/linux/rpm/*.rpm dist/unichat-$VERSION.rpm
          cp target/windows/nsis/*.exe dist/unichat-$VERSION-setup.exe
          cp target/windows/msi/*.msi dist/unichat-$VERSION-setup.msi || echo "No MSI installer found"
          cp target/macos/dmg/*.dmg dist/unichat-$VERSION.dmg || echo "No DMG installer found"
          for file in dist/*; do
            if [ -f "$file" ]; then
              (cd "$(dirname "$file")" && sha256sum "$(basename "$file")" > "$(basename "$file").sha256")
            fi
          done

      - name: Create and upload Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export VERSION="${{ github.ref_name }}"
          if [[ "$VERSION" == *"-"* || "$VERSION" == *"+"* ]]; then
            gh release create "$VERSION" dist/* --prerelease
          else
            gh release create "$VERSION" dist/*
          fi

      - name: Publish unichat-api to zBell
        run: |
          export VERSION="${{ github.ref_name }}"
          NPM_TAG="latest"
          if [[ "$VERSION" == *"-"* || "$VERSION" == *"+"* ]]; then
            NPM_TAG="experimental"
          fi
          TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$ZBELL_REGISTRY" | jq -r .value)
          echo "::add-mask::$TOKEN"
          if ! npm publish "dist/unichat-api-$VERSION.tgz" --registry "$ZBELL_REGISTRY" --tag "$NPM_TAG" "--${ZBELL_REGISTRY#*:}/:_authToken=$TOKEN" --logs-dir npm-logs; then
            cat npm-logs/*.log
            exit 1
          fi

      - name: Upload release assets to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_S3_ENDPOINT: ${{ vars.AWS_S3_ENDPOINT }}
          AWS_S3_BUCKET_NAME: ${{ vars.AWS_S3_BUCKET_NAME }}
          AWS_S3_PATH: ${{ vars.AWS_S3_PATH }}
        run: |
          export VERSION="${{ github.ref_name }}"
          aws s3 cp dist/ "s3://$AWS_S3_BUCKET_NAME/$AWS_S3_PATH/$VERSION/" --recursive --endpoint-url "$AWS_S3_ENDPOINT"
