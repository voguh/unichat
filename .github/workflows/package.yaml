name: Package

on:
  push:
    branches:
      - "**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  TAURI_APP_PATH: .
  TAURI_FRONTEND_PATH: webapp
  NODE_VERSION: 24.16.0
  PNPM_VERSION: 10.33.4
  RUST_VERSION: 1.99.1

defaults:
  run:
    shell: bash

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check license headers
        run: |
          LOG_LEVEL=debug ./zztools/check-license-header.py

      - name: Check event contract parity
        run: |
          LOG_LEVEL=debug ./zztools/check-events-parity.py

      - name: Scan dependencies for vulnerabilities
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=Cargo.lock
            --lockfile=webapp/pnpm-lock.yaml

  webapp-bundle:
    runs-on: ubuntu-24.04
    needs: [static-checks]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare environment
        uses: ./.github/actions/webapp-setup
        with:
          tauri-frontend-path: ${{ env.TAURI_FRONTEND_PATH }}
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Run lint
        working-directory: ${{ env.TAURI_FRONTEND_PATH }}
        run: pnpm lint

      - name: Run typecheck
        working-directory: ${{ env.TAURI_FRONTEND_PATH }}
        run: pnpm typecheck

      - name: Build webapp
        working-directory: ${{ env.TAURI_FRONTEND_PATH }}
        run: pnpm build

      - name: Upload webapp build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webapp-bundle
          path: ${{ env.TAURI_FRONTEND_PATH }}/dist

  package:
    runs-on: ${{ matrix.os }}
    needs: [webapp-bundle]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    steps:
      - id: vars
        run: echo "os=$(echo ${{ runner.os }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare environment
        uses: ./.github/actions/tauri-setup
        with:
          tauri-app-path: ${{ env.TAURI_APP_PATH }}
          tauri-frontend-path: ${{ env.TAURI_FRONTEND_PATH }}
          rust-version: ${{ env.RUST_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Run fmt
        if: ${{ steps.vars.outputs.os == 'linux' }}
        working-directory: ${{ env.TAURI_APP_PATH }}
        run: cargo +nightly fmt --all --check

      - name: Run clippy
        if: ${{ steps.vars.outputs.os == 'linux' }}
        working-directory: ${{ env.TAURI_APP_PATH }}
        run: cargo +nightly clippy -- -D warnings

      - name: Build app
        working-directory: ${{ env.TAURI_APP_PATH }}
        run: |
          if [[ "${{ steps.vars.outputs.os }}" = "windows" ]]; then
            VERSION="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')"
            if [[ "$VERSION" == *"-"* || "$VERSION" == *"+"* ]]; then
              tauri build --bundles "nsis"
            else
              tauri build --bundles "nsis,msi"
            fi
          else
            tauri build
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.vars.outputs.os }}-bundles
          path: ./target/release/bundle
