[package]
name = "unichat"
version = "1.5.0-rc.3"
description = "A cross-platform chat integration without API keys, OAuth, or accounts."
authors = ["Voguh <voguhofc@protonmail.com>"]
homepage = "https://github.com/voguh/unichat"
license = "EPL-2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
anyhow = { version = "=1.0.104", features = ["backtrace"] }
axum = { version = "=0.8.9", features = ["ws"] }
base64 = "=0.23.1"
futures = "=0.3.34"
if-addrs = "=0.15.0"
infer = "=0.22.0"
log = "=0.4.34"
mime_guess = "=2.0.5"
mlua = { version = "=0.12.2", features = ["lua54", "vendored", "serde", "send"] }
moka = { version = "=0.12.16", features = ["sync"] }
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
serde_plain = "=1.0.2"
serde-saphyr = "=1.3.0"
sha2 = "=0.10.9"
tauri = { version = "=2.12.4", features = ["native-tls"] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-log = "=2.10.1"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-store = "=2.5.0"
tokio = { version = "=1.53.3", features = ["full"] }
ureq = { version = "=3.4.2", default-features = false, features = ["json", "native-tls"] }
url = { version = "=2.5.8", features = ["serde"] }
zip = "=9.0.5"

[lints.clippy]
collapsible_else_if = "allow"
collapsible_if = "allow"
needless_late_init = "allow"
needless_return = "allow"
redundant_field_names = "allow"
