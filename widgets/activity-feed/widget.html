<main id="activity-feed" class="activity-feed">
    <header class="feed-header">
        <h1>Activity</h1>
        <div class="feed-controls">
            <details class="filter-menu">
                <summary class="filter-trigger">
                    <span>Events</span>
                    <span id="event-filter-summary" class="filter-summary">All events</span>
                    <span class="filter-chevron" aria-hidden="true"></span>
                </summary>
                <div class="filter-popup" role="group" aria-label="Filter events">
                    <label class="filter-option filter-all-option">
                        <input type="checkbox" data-event-all checked>
                        <span>All events</span>
                    </label>
                    <label class="filter-option">
                        <input type="checkbox" data-event-filter="streaks" checked>
                        <span>Streaks</span>
                    </label>
                    <label class="filter-option">
                        <input type="checkbox" data-event-filter="sponsor" checked>
                        <span>Sponsor</span>
                    </label>
                    <label class="filter-option">
                        <input type="checkbox" data-event-filter="sponsor-gift" checked>
                        <span>Sponsor gift</span>
                    </label>
                    <label class="filter-option">
                        <input type="checkbox" data-event-filter="donations" checked>
                        <span>Donations</span>
                    </label>
                    <label class="filter-option">
                        <input type="checkbox" data-event-filter="cheers" checked>
                        <span>Cheers</span>
                    </label>
                    <label class="filter-option">
                        <input type="checkbox" data-event-filter="raids" checked>
                        <span>Raids</span>
                    </label>
                    <label class="filter-option">
                        <input type="checkbox" data-event-filter="rewards" checked>
                        <span>Channel rewards</span>
                    </label>
                </div>
            </details>
            <details class="filter-menu">
                <summary class="filter-trigger">
                    <span>Platforms</span>
                    <span id="platform-filter-summary" class="filter-summary">All platforms</span>
                    <span class="filter-chevron" aria-hidden="true"></span>
                </summary>
                <div class="filter-popup" role="group" aria-label="Filter platforms">
                    <label class="filter-option filter-all-option">
                        <input type="checkbox" data-platform-all checked>
                        <span>All platforms</span>
                    </label>
                    <div id="platform-filter-options">
                        <label class="filter-option">
                            <input type="checkbox" data-platform-filter="youtube" checked>
                            <span>YouTube</span>
                        </label>
                        <label class="filter-option">
                            <input type="checkbox" data-platform-filter="twitch" checked>
                            <span>Twitch</span>
                        </label>
                    </div>
                </div>
            </details>
        </div>
    </header>
    <section class="feed-scroll" aria-label="Activity history">
        <ol id="activity-list" class="activity-list" aria-live="polite" aria-relevant="additions"></ol>
        <div id="empty-state" class="empty-state">
            <i class="empty-mark fas fa-inbox" aria-hidden="true"></i>
            <p id="empty-message">Waiting for activity</p>
        </div>
    </section>
</main>

<template id="activity-template">
    <li class="activity-entry">
        <div class="entry-avatar">
            <img class="entry-avatar-image" alt="" hidden>
            <span class="entry-avatar-fallback" aria-hidden="true"></span>
        </div>
        <div class="entry-content">
            <div class="entry-topline">
                <span class="entry-kind"></span>
                <span class="entry-platform"></span>
                <time class="entry-time"></time>
            </div>
            <p class="entry-description"></p>
            <p class="entry-message" hidden></p>
        </div>
    </li>
</template>
